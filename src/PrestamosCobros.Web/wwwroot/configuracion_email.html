<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Correo - CrediGest</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #F0F2F5; }
        .soft-card {
            background: #F0F2F5;
            box-shadow: 20px 20px 60px #ccd0d5, -20px -20px 60px #ffffff;
            border-radius: 30px;
        }
        .soft-input {
            background: #F0F2F5;
            box-shadow: inset 6px 6px 12px #ccd0d5, inset -6px -6px 12px #ffffff;
            border: none;
            border-radius: 15px;
        }
        .soft-button {
            background: #001f3f;
            box-shadow: 6px 6px 12px #ccd0d5, -6px -6px 12px #ffffff;
            color: white;
            border-radius: 15px;
            transition: all 0.2s;
        }
        .soft-button:active {
            box-shadow: inset 4px 4px 8px #000, inset -4px -4px 8px #002e5c;
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">
    <div class="soft-card p-10 w-full max-w-md my-8">
        <h1 class="text-2xl font-black text-[#001f3f] mb-2">Correo SMTP</h1>
        <p class="text-xs text-gray-500 mb-8 font-semibold uppercase tracking-widest">Configuración del Servidor</p>

        <form id="configForm" class="space-y-6">
            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-2">Servidor SMTP (Host)</label>
                <input type="text" id="smtpHost" required placeholder="e.g. smtp.gmail.com" class="soft-input w-full px-5 py-4 text-sm focus:outline-none text-[#001f3f] font-bold">
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-2">Puerto SMTP</label>
                <input type="text" id="smtpPort" required placeholder="e.g. 587 o 465" class="soft-input w-full px-5 py-4 text-sm focus:outline-none text-[#001f3f] font-bold">
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-2">Correo Emisor (Usuario)</label>
                <input type="email" id="smtpUser" required placeholder="e.g. tu_correo@gmail.com" class="soft-input w-full px-5 py-4 text-sm focus:outline-none text-[#001f3f] font-bold">
            </div>

            <div>
                <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-2">Contraseña / Token App</label>
                <input type="password" id="smtpPassword" required class="soft-input w-full px-5 py-4 text-sm focus:outline-none text-[#001f3f] font-bold">
            </div>

            <div id="statusMessage" class="text-center text-xs font-bold py-2 hidden"></div>

            <button type="submit" class="soft-button w-full py-5 text-xs font-black uppercase tracking-widest mt-4">
                Guardar Configuración
            </button>
        </form>

        <div class="mt-8 pt-8 border-t border-gray-200">
            <h2 class="text-lg font-black text-[#001f3f] mb-2">Prueba de Envío</h2>
            <p class="text-[10px] text-gray-500 mb-4 font-semibold uppercase tracking-widest">Verifica tu conexión SMTP</p>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2 ml-2">Correo Destino</label>
                    <input type="email" id="testEmail" placeholder="destinatario@correo.com" class="soft-input w-full px-5 py-4 text-sm focus:outline-none text-[#001f3f] font-bold">
                </div>
                <button id="btnTest" type="button" class="soft-button w-full py-4 text-[10px] font-black uppercase tracking-widest bg-gray-600">
                    Enviar Correo de Prueba
                </button>
            </div>
        </div>

        <div class="mt-8 pt-8 border-t border-gray-200 flex justify-between items-center">
            <a href="/" class="text-[10px] font-black uppercase tracking-widest text-gray-400 hover:text-[#001f3f]">Volver al Panel</a>
            <span id="fechaActualizacion" class="text-[8px] text-gray-400 font-bold uppercase"></span>
        </div>
    </div>

    <script>
        const statusDiv = document.getElementById('statusMessage');

        // Cargar configuración inicial
        async function cargarConfig() {
            try {
                const res = await fetch('/api/configuracion/email/obtener');
                if (res.ok) {
                    const data = await res.json();
                    document.getElementById('smtpHost').value = data.smtpHost || '';
                    document.getElementById('smtpPort').value = data.smtpPort || '';
                    document.getElementById('smtpUser').value = data.smtpUser || '';
                    if (data.smtpPassword) {
                        document.getElementById('smtpPassword').placeholder = data.smtpPassword;
                        // Hacemos que no sea requerido si ya hay uno guardado
                        document.getElementById('smtpPassword').removeAttribute('required');
                    } else {
                        document.getElementById('smtpPassword').setAttribute('required', 'required');
                    }
                }
            } catch (err) {
                console.error("Error cargando configuración de correo:", err);
            }
        }

        document.getElementById('configForm').onsubmit = async (e) => {
            e.preventDefault();
            
            const payload = {
                smtpHost: document.getElementById('smtpHost').value,
                smtpPort: document.getElementById('smtpPort').value,
                smtpUser: document.getElementById('smtpUser').value,
                smtpPassword: document.getElementById('smtpPassword').value
            };

            statusDiv.classList.remove('hidden', 'text-green-600', 'text-red-600');
            statusDiv.innerText = "Guardando...";
            statusDiv.classList.add('block');

            try {
                const res = await fetch('/api/configuracion/email/guardar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    statusDiv.innerText = "Configuración de correo guardada correctamente";
                    statusDiv.classList.add('text-green-600');
                    setTimeout(() => statusDiv.classList.add('hidden'), 3000);
                    cargarConfig(); // Recargar para ver placeholders actualizados
                } else {
                    const err = await res.text();
                    statusDiv.innerText = "Error: " + err;
                    statusDiv.classList.add('text-red-600');
                }
            } catch (err) {
                statusDiv.innerText = "Error de conexión";
                statusDiv.classList.add('text-red-600');
            }
        };

        document.getElementById('btnTest').onclick = async () => {
            const destinatario = document.getElementById('testEmail').value;
            if (!destinatario) {
                alert("Por favor ingresa un correo de destino.");
                return;
            }

            statusDiv.classList.remove('hidden', 'text-green-600', 'text-red-600');
            statusDiv.innerText = "Enviando correo de prueba...";
            statusDiv.classList.add('block');

            try {
                const res = await fetch('/api/configuracion/email/test-correo', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ destinatario })
                });

                if (res.ok) {
                    statusDiv.innerText = "¡Correo de prueba enviado con éxito!";
                    statusDiv.classList.add('text-green-600');
                } else {
                    const err = await res.json();
                    statusDiv.innerText = "Error: " + (err.mensaje || "No se pudo enviar");
                    statusDiv.classList.add('text-red-600');
                }
            } catch (err) {
                statusDiv.innerText = "Error de conexión al servidor";
                statusDiv.classList.add('text-red-600');
            }
        };

        cargarConfig();
    </script>
</body>
</html>
